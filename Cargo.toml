[package]
name = "shft"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Fast, offline, safe-by-default image conversion and optimization"
license = "MIT"
repository = "https://github.com/aditipolkam/shft"
keywords = ["image", "webp", "jpeg", "png", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
exif = { package = "kamadak-exif", version = "0.6" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
heif-oxide = "0.1.0"
indicatif = "0.17"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.12"
thiserror = "2.0"
walkdir = "2.5"
webp = "0.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
